<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>INH - Individualisation de la posologie</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="header">
        <h1>INH</h1>
        <p>Individualisation de la posologie</p>
    </div>

    <div class="card">

        <h2>Informations du patient</h2>

        <div class="form-grid">

            <div class="form-group">
                <label for="nom">Nom</label>
                <input type="text" id="nom" placeholder="Nom">
            </div>

            <div class="form-group">
                <label for="prenom">Prénom</label>
                <input type="text" id="prenom" placeholder="Prénom">
            </div>

            <div class="form-group">
                <label for="age">Âge (ans)</label>
                <input type="number" id="age" min="0" placeholder="Âge">
            </div>

            <div class="form-group">
                <label for="sexe">Sexe</label>
                <select id="sexe">
                    <option value="">Sélectionner</option>
                    <option value="1">Homme</option>
                    <option value="0">Femme</option>
                </select>
            </div>

            <div class="form-group">
                <label for="poids">Poids (kg)</label>
                <input type="number" id="poids" min="1" step="0.1" placeholder="Poids">
            </div>

            <div class="form-group">
                <label for="dose">Dose (mg/jour)</label>
                <input type="number" id="dose" min="0" step="0.1" placeholder="Dose">
            </div>

            <div class="form-group full-width">
                <label for="c3">Concentration C<sub>3</sub> (mg/L)</label>
                <input type="number" id="c3" min="0.001" step="0.01" placeholder="Concentration C3">
            </div>

        </div>

        <div class="calculation">

            <button id="btnCalculer" class="btn-primary">
                Calculer
            </button>

            <div id="resultatDP" class="result hidden">
                <span>Dose pondérale (DP)</span>
                <strong id="dpValue">-</strong>
                <span>mg/kg/jour</span>
            </div>

        </div>

        <div class="navigation">
            <button id="btnRecommandation" class="btn-secondary">
                Recommandation →
            </button>
        </div>

    </div>

</div>

<script src="renderer.js"></script>

</body>
</html>
